workflows:
  ios-native-quick-start:
    name: iOS Native
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: 'Vitrember'
    environment:
      # Подпись берётся из хранилища Codemagic (Settings → Code signing
      # identities): distribution-сертификат «Vitrember» лежит там вместе с
      # приватным ключом, одноимённый provisioning profile выпущен под него и
      # подтянут из портала. Один сертификат обслуживает все сборки.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.daviddzagania.vitrember
      vars:
        BUNDLE_ID: "com.daviddzagania.vitrember"
        XCODE_WORKSPACE: "Vitrember.xcodeproj"
        XCODE_SCHEME: "Vitrember"
        APP_STORE_APPLE_ID: 6809743267
      xcode: latest
    scripts:
      - name: Set up provisioning profiles settings on Xcode project
        script: xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
